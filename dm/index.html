<!DOCTYPE html>
<html lang="es" data-tema="oscuro" data-anim="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calabozos y Código · Dungeon Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --fondo:#1a1a2e;--panel:#16213e;--panel2:#0f3460;--chat:#0f1a2e;
  --dorado:#c9a84c;--texto:#f0e6d0;--tenue:#8a8a9a;--verde:#4CAF50;
  --rojo:#e94560;--borde:#3a4a6b;--fs:14px;--fsChat:13px;--radio:12px;
}
html[data-tema="claro"]{
  --fondo:#f4f6f9;--panel:#fff;--panel2:#e9ecef;--chat:#fafafa;
  --dorado:#a88a3a;--texto:#1a1a2e;--tenue:#5a5a6a;--borde:#ccc;
}
html[data-contraste="alto"]{
  --fondo:#000;--panel:#111;--panel2:#222;--chat:#000;
  --dorado:#ffd700;--texto:#fff;--tenue:#ddd;--borde:#888;
}
html[data-anim="off"] *{animation:none!important;transition:none!important}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;background:var(--fondo);color:var(--texto);
  height:100dvh;display:flex;flex-direction:column;padding:4px;overflow:hidden;font-size:var(--fs);
}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{
  padding:5px 10px;border-radius:6px;border:1px solid var(--borde);
  background:var(--panel2);color:var(--texto);cursor:pointer;font-size:.75rem;font-weight:600;
}
.btn:hover{background:var(--dorado);color:#1a1a2e}
.btn.primary{background:var(--dorado);color:#1a1a2e;border-color:var(--dorado)}
.btn.danger{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{
  padding:6px 8px;border-radius:6px;border:1px solid var(--borde);
  background:var(--panel);color:var(--texto);font-size:16px;outline:none;
}
input:focus,select:focus{border-color:var(--dorado)}
#header{
  background:linear-gradient(90deg,var(--panel2),var(--panel));
  padding:6px 10px;border-bottom:2px solid var(--dorado);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:0 0 auto
}
#header .title{font-weight:700;font-size:.85rem;white-space:nowrap}
#header .acciones{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
#session{
  background:var(--panel2);padding:4px 10px;border-bottom:1px solid var(--borde);
  display:flex;align-items:center;gap:5px;flex:0 0 auto;overflow-x:auto;font-size:.72rem
}
#session::-webkit-scrollbar{display:none}
.badge-modo{
  padding:2px 8px;border-radius:99px;font-weight:700;font-size:.62rem;
  white-space:nowrap;flex-shrink:0
}
.modo-docente{background:rgba(201,168,76,.2);color:var(--dorado);border:1px solid var(--dorado)}
.modo-alumno{background:rgba(76,175,80,.2);color:var(--verde);border:1px solid var(--verde)}
#session input[type="text"]{
  width:80px;padding:3px 6px;font-size:.75rem;text-align:center;
  text-transform:uppercase;flex-shrink:0
}
.sala-info{
  font-size:.68rem;padding:2px 8px;border-radius:4px;
  background:rgba(76,175,80,.15);color:var(--verde);white-space:nowrap
}
.sala-info.error{background:rgba(233,69,96,.15);color:var(--rojo)}
#main{
  flex:1 1 0;min-height:0;
  display:grid;gap:4px;padding:4px;
  grid-template-columns:180px 1fr 180px;
  grid-template-rows:1fr;
  grid-template-areas:"heroes cam enem";
}
#panel-jugadores{grid-area:heroes}
#camara-ar{grid-area:cam}
#panel-enemigos{grid-area:enem}
.panel{
  background:var(--panel);border:1px solid var(--dorado);border-radius:8px;
  padding:5px;overflow-y:auto;min-height:0
}
.panel h2{
  color:var(--dorado);font-size:.72rem;text-align:center;padding-bottom:3px;
  margin-bottom:4px;border-bottom:1px solid var(--dorado);position:sticky;top:0;background:var(--panel)
}
.tarjeta{
  background:var(--panel2);border:1px solid var(--borde);border-radius:6px;
  padding:5px;margin-bottom:4px;font-size:.72rem
}
.tarjeta h3{color:var(--dorado);font-size:.75rem;margin-bottom:2px}
.tarjeta small{color:var(--tenue);font-size:.65rem}
.vida-fondo{background:#333;border-radius:3px;height:10px;overflow:hidden;margin-top:3px}
.vida-barra{height:100%;background:linear-gradient(90deg,#c62828,var(--rojo));text-align:center;font-size:.55rem;line-height:10px;color:#fff}
#camara-ar{
  border:2px solid var(--dorado);border-radius:8px;overflow:hidden;
  background:#000;position:relative;min-height:0
}
#camara-ar iframe{width:100%;height:100%;border:none;display:block}
#camara-ar:-webkit-full-screen{border:none;border-radius:0}
#camara-ar:fullscreen{border:none;border-radius:0}
body.teatro #main{grid-template-areas:"cam cam cam"}
body.teatro #panel-jugadores,body.teatro #panel-enemigos{display:none}
body.teatro #zona-narracion{
  position:fixed;bottom:0;left:0;right:0;max-height:45vh;
  background:rgba(0,0,0,.88);border-top:2px solid var(--dorado);
  z-index:10;border-radius:12px 12px 0 0;padding-bottom:8px
}
#zona-narracion{
  flex:0 0 26vh;min-height:100px;display:flex;flex-direction:column;
  background:var(--chat);border-top:2px solid var(--dorado);overflow:hidden
}
#zona-narracion h3{
  padding:3px 10px;font-size:.7rem;color:var(--dorado);flex:0 0 auto
}
#chat{
  flex:1;min-height:0;padding:4px 10px 6px;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch
}
.msg{
  max-width:90%;padding:6px 9px;border-radius:8px;line-height:1.4;
  font-size:var(--fsChat);white-space:pre-wrap;word-wrap:break-word;flex:0 0 auto
}
.msg.user{background:var(--panel2);border:1px solid var(--borde);align-self:flex-end;border-bottom-right-radius:2px}
.msg.ai{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);align-self:flex-start;border-bottom-left-radius:2px}
.msg.system{background:rgba(201,168,76,.15);color:var(--dorado);align-self:center;font-size:.68rem;text-align:center}
body.custom-dm .msg.ai{
  font-size:var(--fs-dm,13px);color:var(--color-dm,var(--texto));background:var(--bg-dm,rgba(201,168,76,.1))
}
#barra{
  flex:0 0 auto;background:var(--panel2);border-top:1px solid var(--borde);
  padding:5px 8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center
}
#user-input{flex:1 1 160px;min-width:0}
#btn-enviar{padding:8px 14px}
.accion-btn{flex:0 0 auto;padding:7px 10px;font-size:.72rem}
details.settings{
  margin-top:4px;padding:6px 10px;background:rgba(0,0,0,.15);border-radius:6px;
  border:1px solid var(--borde);font-size:.72rem
}
details.settings summary{cursor:pointer;color:var(--tenue);font-weight:600}
details.settings .row{margin-top:5px}
details.settings input,details.settings select{font-size:.72rem;padding:3px 6px}
details.settings textarea{
  width:100%;height:80px;font-family:monospace;font-size:.65rem;padding:4px;
  background:var(--panel);color:var(--texto);border:1px solid var(--borde);border-radius:6px
}
dialog#tablero{
  width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 20px);
  padding:14px 16px;border:1px solid var(--dorado);border-radius:12px;
  background:#fffdf5;color:#333
}
dialog#tablero::backdrop{background:rgba(0,0,0,.65)}
dialog#tablero h2{font-size:16px;color:#4e3e1f;margin-bottom:8px}
#mapa-grid{display:grid;grid-template-columns:repeat(6,minmax(28px,1fr));gap:3px}
.celda{
  min-height:30px;padding:2px;border:1px solid #e0cf9f;border-radius:4px;
  background:#fff;font-size:9px;color:#786437
}
.celda.jug{background:#e1f2ff;border-color:#6fb5e6}
.celda.ene{box-shadow:inset 0 0 0 1px #df7e7e}
.celda .pl{display:block;color:#0b5f9d;font-weight:800;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.celda .en{display:block;color:#a12c2c;font-weight:800;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Gate overlay */
#gate-overlay{
  position:fixed;inset:0;background:var(--fondo);z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:16px
}
#gate-card{
  background:var(--panel);border:2px solid var(--dorado);border-radius:12px;
  padding:28px 24px;max-width:400px;width:100%;text-align:center
}
#gate-card h2{color:var(--dorado);font-size:1.3rem;margin-bottom:6px}
#gate-card p{color:var(--tenue);font-size:.82rem;margin-bottom:16px}
#gate-input{
  width:100%;padding:12px;text-align:center;text-transform:uppercase;
  font-size:16px;letter-spacing:2px;margin-bottom:12px
}
#gate-error{color:var(--rojo);font-size:.75rem;margin-top:10px;display:none}

/* Accessibility floating panel */
#a11y-panel{
  display:none;position:fixed;top:52px;right:10px;z-index:1000;
  background:var(--panel);border:1px solid var(--dorado);border-radius:10px;
  padding:12px;width:240px;box-shadow:0 8px 24px rgba(0,0,0,.5)
}
#a11y-panel h3{color:var(--dorado);font-size:.8rem;margin-bottom:10px;text-align:center}
#a11y-panel .row{margin-bottom:8px}
#a11y-panel label{font-size:.75rem;color:var(--tenue);flex:1}
#a11y-panel .btn{flex:1;text-align:center}

@media(max-width:900px){#main{grid-template-columns:140px 1fr 140px}}
@media(max-width:768px){
  body{padding:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #header{padding:4px 8px}
  #header .title{font-size:.72rem}
  #header .acciones .btn{padding:4px 7px;font-size:.68rem}
  #session{padding:3px 8px;gap:4px}
  #session input[type="text"]{width:65px;padding:2px 5px;font-size:.68rem}
  #main{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"cam cam" "heroes enem"}
  #camara-ar{height:30vh;min-height:150px;max-height:300px}
  .panel{max-height:85px;border-width:1px;padding:4px}
  .panel h2{font-size:.65rem}
  .tarjeta{font-size:.65rem;padding:4px}
  #zona-narracion{flex:0 0 22vh}
  .msg{font-size:.72rem}
  #barra{padding:4px 6px}
  .accion-btn{flex:1 1 auto}
  #a11y-panel{width:calc(100vw - 20px);right:10px;left:10px}
}
@media(max-width:400px){#camara-ar{height:26vh;min-height:130px}.panel{max-height:65px}}
@media(orientation:landscape) and (max-height:500px){
  #main{grid-template-columns:90px 1fr 90px;grid-template-areas:"heroes cam enem"}
  #camara-ar{height:auto}
  #zona-narracion{flex:0 0 18vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ==================== GATE OVERLAY ==================== -->
<div id="gate-overlay">
  <div id="gate-card">
    <h2>🏰 Calabozos y Código</h2>
    <p>Ingresá el código de clase para continuar</p>
    <input id="gate-input" type="text" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off">
    <button class="btn primary" onclick="ingresarClase()" style="width:100%">Ingresar</button>
    <p id="gate-error"></p>
  </div>
</div>

<!-- ==================== HEADER ==================== -->
<div id="header">
  <span class="title">🏰 Calabozos y Código · DM</span>
  <div class="acciones">
    <button class="btn" onclick="toggleA11y()" title="Accesibilidad" aria-label="Accesibilidad">♿</button>
    <button class="btn" id="btn-nueva" onclick="iniciarNuevaAventura()">Nueva</button>
    <button class="btn" id="btn-tablero" onclick="abrirTablero()">Tablero</button>
    <button class="btn" onclick="toggleFullscreen()" title="Pantalla completa">⛶</button>
  </div>
</div>

<!-- ==================== PANEL ACCESIBILIDAD ==================== -->
<div id="a11y-panel">
  <h3>Accesibilidad</h3>
  <div class="row">
    <button class="btn" onclick="ajustarFuente(1)">A+</button>
    <button class="btn" onclick="ajustarFuente(-1)">A-</button>
  </div>
  <div class="row">
    <button class="btn" id="a11y-tema" onclick="toggleTema()">🌙 Oscuro</button>
  </div>
  <div class="row">
    <button class="btn" id="a11y-contraste" onclick="toggleContraste()">◐ Contraste</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="a11y-anim" checked onchange="toggleAnimaciones(this.checked)"> Animaciones</label>
  </div>
  <div class="row">
    <button class="btn" onclick="toggleCustomDM()">🎨 Texto DM</button>
  </div>
  <div class="row">
    <button class="btn" onclick="restablecerA11y()">↺ Restablecer</button>
  </div>
</div>

<!-- ==================== SESSION ==================== -->
<div id="session">
  <span id="modo-indicador" class="badge-modo modo-docente">👨‍🏫 DOCENTE</span>
  <div id="panel-docente" style="display:contents">
    <button class="btn primary" id="btn-crear" onclick="crearSalaDocente()">🎬 Crear sala</button>
    <button class="btn" id="btn-traspaso" onclick="generarTraspaso()" style="display:none">🔑 Traspaso</button>
    <button class="btn" id="btn-recuperar-host" onclick="recuperarHost()" style="display:none">🔓 Recuperar host</button>
    <button class="btn danger" id="btn-cerrar-sala" onclick="cerrarSalaDocente()" style="display:none">🔒 Cerrar sala</button>
    <span class="sala-info" id="sala-info" hidden></span>
  </div>
  <div id="panel-alumno" style="display:none;gap:5px" class="row">
    <input type="text" id="input-sala" maxlength="6" placeholder="ABC12" autocapitalize="characters">
    <button class="btn" onclick="unirseSalaAlumno()">🔗 Unirse</button>
    <button class="btn" id="btn-canjear" onclick="canjearTraspaso()" style="display:none">🔑 Recibir control</button>
    <span class="sala-info" id="alumno-sala-info"></span>
  </div>
  <span id="p2p-badge" class="sala-info" style="display:none">⚡ P2P</span>
  <button class="btn" id="btn-toggle-modo" onclick="alternarModo()">Cambiar a alumno</button>
</div>

<!-- ==================== MAIN ==================== -->
<div id="main">
  <div class="panel" id="panel-jugadores">
    <h2>⚔️ Héroes</h2>
    <div id="lista-jugadores"><p style="color:var(--tenue);font-size:.7rem;text-align:center">Esperando...</p></div>
  </div>
  <div id="camara-ar">
    <iframe id="ar-game-frame" src="../index.html"
            allow="camera *; microphone *" allowfullscreen></iframe>
  </div>
  <div class="panel" id="panel-enemigos">
    <h2>👹 Enemigos</h2>
    <div id="lista-enemigos"><p style="color:var(--tenue);font-size:.7rem;text-align:center">Sin enemigos.</p></div>
  </div>
</div>

<!-- ==================== CHAT ==================== -->
<div id="zona-narracion">
  <h3>📜 Narración</h3>
  <div id="chat"></div>
</div>

<!-- ==================== ACCIONES ==================== -->
<div id="barra">
  <input type="text" id="user-input" placeholder="Esperando conexión..." disabled onkeypress="onEnter(event)">
  <button class="btn primary" id="btn-enviar" onclick="enviarMensaje()" disabled>Enviar</button>
  <button class="btn accion-btn" onclick="accionD20()">🎲 D20</button>
  <button class="btn accion-btn" onclick="accionAtacar()">⚔️ Atacar</button>
  <button class="btn accion-btn" onclick="accionCurar()">💚 Curar</button>
</div>

<!-- ==================== CONFIGURACIÓN AVANZADA ==================== -->
<details class="settings">
  <summary>⚙️ Configuración avanzada</summary>
  <div class="row">
    <label>Servidor Ollama:</label>
    <input type="text" id="cfg-ollama" placeholder="192.168.1.20" style="flex:1 1 150px">
    <button class="btn" onclick="conectarOllamaManual()">Conectar</button>
    <button class="btn" onclick="buscarOllama()">Buscar</button>
    <select id="cfg-modelo" style="flex:1 1 120px"></select>
  </div>
  <div class="row" id="microbit-row">
    <button class="btn primary" id="btn-microbit" onclick="conectarMicrobit()">Conectar micro:bit</button>
    <button class="btn" id="btn-microbit-off" onclick="desconectarMicrobit()" disabled>Desconectar</button>
    <span id="mb-status" style="color:var(--tenue);font-size:.68rem">Sin conectar</span>
  </div>
  <div id="stats" style="margin-top:5px;color:var(--tenue);font-size:.65rem">Sin actividad.</div>
  <textarea id="log" readonly></textarea>
</details>

<!-- ==================== TABLERO ==================== -->
<dialog id="tablero">
  <h2>Tablero del grupo</h2>
  <div class="row" style="margin-bottom:8px">
    <label style="font-size:.72rem;color:#5f4b22">Mapa:</label>
    <select id="mapa-select" onchange="cambiarMapa()" style="padding:4px 6px;border:1px solid #d9c58f;border-radius:4px">
      <option value="inicios">Inicios</option>
      <option value="castillo">Castillo</option>
      <option value="ruinas">Ruinas</option>
      <option value="pantano">Pantano</option>
      <option value="bosque">Bosque</option>
      <option value="bosque_ruinas">Bosque con ruinas</option>
    </select>
    <button class="btn" style="margin-left:auto;background:#6c757d;color:#fff" onclick="cerrarTablero()">Cerrar</button>
  </div>
  <div id="mapa-grid"></div>
  <div id="mapa-leyenda" style="margin-top:6px;font-size:.7rem;color:#5d5d5d"></div>
</dialog>

<script src="calabozos-state-bridge.js"></script>
<script>
/* ============================================================ CONFIG */
const PUERTO_OLLAMA = 11434;
const GRUPO_RADIO = 99;
const TAM_MAPA = 6;
const CLAVE_PARTIDA = "calabozos.partida.v20";
const CLAVE_OLLAMA = "calabozos.ollama.url";
const CLAVE_GATE = "calabozos.gateToken";
const CLAVE_ADMIN = "calabozos.adminToken";
const MAPAS = [
  {id:"inicios",codigo:"I",nombre:"Inicios"},
  {id:"castillo",codigo:"C",nombre:"Castillo"},
  {id:"ruinas",codigo:"R",nombre:"Ruinas"},
  {id:"pantano",codigo:"P",nombre:"Pantano"},
  {id:"bosque",codigo:"B",nombre:"Bosque"},
  {id:"bosque_ruinas",codigo:"X",nombre:"Bosque con ruinas"}
];
const MAPAS_ID = Object.fromEntries(MAPAS.map(m=>[m.id,m]));

const APPS_SCRIPT_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbyqG2PUzr9f-1-pFQhKSqZD9FoO_fkX3Sl6jGVXMlrzahgKPNmZ79UTEjayd7Ytqr4/exec";

const CONFIG = { appsScriptUrl: APPS_SCRIPT_URL_DEFAULT, arFrameId: "ar-game-frame" };

/* ============================================================ ESTADO */
let modo = "docente";
let codigoSala = "";
let gateToken = localStorage.getItem(CLAVE_GATE) || "";
let adminToken = sessionStorage.getItem(CLAVE_ADMIN) || "";
let sessionTokenDocente = localStorage.getItem("calabozos.hostToken") || "";
let sessionTokenAlumno = "";
let peerIdAlumno = "";
let jugadorIdAlumno = localStorage.getItem("calabozos.jugadorId") || "";
let nombreAlumno = "Alumno";
let partida = cargarPartida();
let historial = partida.historial;
let urlOllama = null;
let modoDM = "fallback";
let generando = false;
let p2pHost = null, p2pPeer = null, p2pConectado = false;
let pollingGAS = false, debouncePub = null;
let pollingDocenteId = null, ultRevDoc = 0, ultSeqDoc = 0;
let microbitPort = null, lectorMicrobit = null, serialAbierto = false;
let colaSerie = Promise.resolve();

/* ============================================================ DEDUPLICACIÓN */
const _recientes = [];
function yaEstaEnChat(autor, texto) {
  const ahora = Date.now();
  while (_recientes.length && ahora - _recientes[0].ts > 15000) _recientes.shift();
  const clave = (autor || "") + "::" + (texto || "");
  const existe = _recientes.some(m => m.clave === clave);
  if (!existe) _recientes.push({ clave, ts: ahora });
  return existe;
}

/* ============================================================ DOM */
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("user-input"), btnEnviar = $("btn-enviar");
const listaJugadores = $("lista-jugadores"), listaEnemigos = $("lista-enemigos");

/* ============================================================ UTIL */
function txt(v,m){return String(v||"").trim().slice(0,m)}
function coord(x,y){return String.fromCharCode(65+x)+String(y+1)}
function int(v,min,max,alt){const n=Number(v);return Number.isInteger(n)&&n>=min&&n<=max?n:alt}
function ahora(){return new Date().toISOString()}
function log(m){const el=$("log"); if(!el)return; const t=new Date().toLocaleTimeString(); el.value+=`[${t}] ${m}\n`; el.scrollTop=el.scrollHeight}

/* ============================================================ PARTIDA */
function crearEstadoVacio(){
  return {revision:0,mapaActual:"inicios",ultimoDado:null,turno:"",ultimoEvento:"",jugadores:{},enemigos:{},
    mapas:Object.fromEntries(MAPAS.map(m=>[m.id,{visitas:m.id==="inicios"?1:0}]))};
}
function crearPartidaVacia(){
  return {id:crypto.randomUUID?crypto.randomUUID():"p-"+Date.now(),historial:[],resumen:"",mensajesResumidos:0,estadoJuego:crearEstadoVacio()};
}
function cargarPartida(){
  try{const raw=localStorage.getItem(CLAVE_PARTIDA); if(!raw)return crearPartidaVacia();
    const g=JSON.parse(raw); return Object.assign(crearPartidaVacia(),{historial:Array.isArray(g.historial)?g.historial:[],
      resumen:txt(g.resumen,5000),mensajesResumidos:Number(g.mensajesResumidos)||0,estadoJuego:normalizarEstado(g.estadoJuego)});
  }catch(e){return crearPartidaVacia()}
}
function normalizarEstado(e){
  const s=crearEstadoVacio(); if(!e||typeof e!=="object")return s;
  s.revision=int(e.revision,0,999999,0);
  s.mapaActual=MAPAS_ID[e.mapaActual]?e.mapaActual:"inicios";
  s.turno=txt(e.turno,40); s.ultimoEvento=txt(e.ultimoEvento,160);
  if(e.ultimoDado)s.ultimoDado={jugador:txt(e.ultimoDado.jugador,12),valor:Number(e.ultimoDado.valor)};
  if(e.jugadores)Object.entries(e.jugadores).forEach(([id,j])=>{
    s.jugadores[id]={ultimaConexion:j.ultimaConexion||"",ultimoDado:Number.isFinite(Number(j.ultimoDado))?Number(j.ultimoDado):null,
      x:int(j.x,0,TAM_MAPA-1,0),y:int(j.y,0,TAM_MAPA-1,0),mapaId:MAPAS_ID[j.mapaId]?j.mapaId:s.mapaActual,
      peerId: j.peerId || null};
  });
  if(e.enemigos)Object.entries(e.enemigos).forEach(([id,en])=>{
    const vm=int(en.vidaMaxima,1,999,1),v=int(en.vida,0,vm,vm);
    s.enemigos[id]={id,nombre:txt(en.nombre,60)||id,mapaId:MAPAS_ID[en.mapaId]?en.mapaId:s.mapaActual,
      x:int(en.x,0,TAM_MAPA-1,0),y:int(en.y,0,TAM_MAPA-1,0),vida:v,vidaMaxima:vm,activo:v>0,derrotado:v===0};
  });
  return s;
}
function guardarPartida(){try{partida.historial=historial;localStorage.setItem(CLAVE_PARTIDA,JSON.stringify(partida))}catch(e){}}

function validarEstadoOriginal(e){
  if(!e||typeof e!=="object"||Array.isArray(e))return false;
  const validos=["inicios","castillo","ruinas","pantano","bosque","bosque_ruinas"];
  if(typeof e.mapaActual!=="string"||validos.indexOf(e.mapaActual)<0)return false;
  if(!e.jugadores||typeof e.jugadores!=="object"||Array.isArray(e.jugadores))return false;
  if(!e.enemigos||typeof e.enemigos!=="object"||Array.isArray(e.enemigos))return false;
  if(!Number.isInteger(e.revision)||e.revision<0)return false;
  for(const jid in e.jugadores){
    const j=e.jugadores[jid];
    if(!j||typeof j!=="object")return false;
    if(!Number.isInteger(j.x)||j.x<0||j.x>5)return false;
    if(!Number.isInteger(j.y)||j.y<0||j.y>5)return false;
  }
  return true;
}

async function ingresarClase(){

      const msgs = {
        "pin_requerido":"PIN docente requerido. Volvé a intentar.",
        "rate_limit_crear":"Demasiadas salas creadas. Esperá una hora.",
        "sala_existente":"Ese código ya existe. Reintentá."

    }
    codigoSala = cod;

    $("btn-traspaso").style.display = "inline-block";

        const clave = (jid || name || id).toUpperCase();
        if(!partida.estadoJuego.jugadores[clave]){

            x:0, y:0, mapaId:partida.estadoJuego.mapaActual,
            ultimaConexion: new Date().toISOString(), ultimoDado:null, peerId:id
          };
        } else {
          partida.estadoJuego.jugadores[clave].peerId = id;
        }
        enviarEstadoPorP2P(id);
        actualizarContadorP2P();
        renderizarTodo();
      },
      onPeerMessage: (id, msg) => procesarMensajeP2PPeer(id, msg),
      onPeerDisconnected: () => { agregarMensaje(`🔌 peer desconectado`,"system"); actualizarContadorP2P(); renderizarTodo(); },
      onHostRevoked: () => {
        if(p2pHost){p2pHost.broadcast({tipo:"host-changed"});setTimeout(()=>{if(p2pHost){p2pHost.stop();p2pHost=null}},150)}

    if(jugadorIdAlumno)localStorage.setItem("calabozos.jugadorId",jugadorIdAlumno);
  }
  try{

    if(!r.ok){
      const msgMap={
        "codigo_clase_requerido":"❌ Tu sesión de clase expiró. Recargá la página e ingresá el código de nuevo.",
        "baneado":"❌ Fuiste expulsado. Esperá unos minutos.",

        "rate_limit_global":"⏳ Demasiados intentos. Esperá un minuto.",
        "rate_limit_codigo":"⏳ Demasiados intentos con este código.",
        "sala_llena":"❌ Sala llena (máx. 40).",
        "sala_invalida":"❌ Sala no encontrada o expirada."
      };
      throw new Error(msgMap[r.error]||r.error);
    }
    sessionTokenAlumno=r.sessionToken;
    peerIdAlumno=r.peerId;
    info.textContent="Conectando P2P...";
    p2pPeer=new CalabozosStateBridge.P2PPeer(c,sessionTokenAlumno,peerIdAlumno,nombreAlumno,jugadorIdAlumno,{
      onConnected:()=>{
        p2pConectado=true;
        info.textContent=`✓ P2P · ${c}`; info.className="sala-info";
        [...chat.querySelectorAll(".msg.system")].forEach(el=>{if(el.textContent.includes("vía GAS"))el.remove();});
        agregarMensaje("🔗 Conectado al DM (P2P)","system");
        $("p2p-badge").style.display="inline-flex"; $("p2p-badge").textContent="⚡ P2P";
        detenerGAS();
      },
      onMessage:(msg)=>{
        if(msg.tipo==="estado")aplicarEstadoRemoto(msg.estado);
        else if(msg.tipo==="chat")agregarMensaje(msg.texto,"ai");
        else if(msg.tipo==="kick"){
          p2pPeer&&p2pPeer.desconectar(); p2pPeer=null; p2pConectado=false;
          sessionTokenAlumno=""; $("p2p-badge").style.display="none";
          info.textContent="❌ Fuiste expulsado"; info.className="sala-info error";
          ajustarInput(false);
        } else if(msg.tipo==="host-changed"){
          p2pPeer&&p2pPeer.desconectar(); p2pPeer=null; p2pConectado=false;
          $("p2p-badge").style.display="none";
          agregarMensaje("🔄 El host cambió. Reconectando...","system");
          setTimeout(()=>{ if(!p2pConectado&&sessionTokenAlumno) iniciarP2P(sessionTokenAlumno); },2500);
        }
      },
      onDisconnected:()=>{
        p2pConectado=false; $("p2p-badge").style.display="none";
        info.textContent=`⚠ P2P perdido · usando GAS`; info.className="sala-info error";
        iniciarGAS(c);
      }
    });
    const timeout=setTimeout(()=>{
      if(!p2pConectado){
        info.textContent=`✓ En sala ${c} (GAS)`; info.className="sala-info";
        if(![...chat.querySelectorAll(".msg.system")].some(el=>el.textContent.includes("vía GAS"))){
          agregarMensaje("🔗 Conectado vía GAS (fallback)","system");
        }
        iniciarGAS(c);
      }
    },20000);
    p2pPeer.conectar().then(()=>clearTimeout(timeout)).catch(()=>{
      clearTimeout(timeout);
      if(!p2pConectado){
        info.textContent=`✓ En sala ${c} (GAS)`; info.className="sala-info";
        if(![...chat.querySelectorAll(".msg.system")].some(el=>el.textContent.includes("vía GAS"))){
          agregarMensaje("🔗 Conectado vía GAS (fallback)","system");
        }
        iniciarGAS(c);
      }
    });
    ajustarInput(true);
  }catch(e){
    info.textContent="✗ "+e.message; info.className="sala-info error";
  }
}
function iniciarP2P(token){

/* ============================================================ GAS FALLBACK */
function iniciarGAS(c){
  if(pollingGAS||!sessionTokenAlumno)return;
  CalabozosStateBridge.iniciarPolling(c,sessionTokenAlumno,{
    nombre:nombreAlumno, jugadorId:jugadorIdAlumno, gateToken:gateToken,
    onEstado:(e)=>aplicarEstadoRemoto(e),
    onMensajes:(msgs)=>msgs.forEach(m=>{
      if(m.tipo==="chat"&&m.autor!==nombreAlumno){
        if(yaEstaEnChat(m.autor,m.texto))return;
        agregarMensaje(`🎓 ${m.autor}: ${m.texto}`,"user");
      }
    }),
    onRejoin:(re)=>{
      sessionTokenAlumno=re.sessionToken;
      peerIdAlumno=re.peerId;
      log("Sesión renovada");
    },
    onError:(e)=>{
      if(e.code==="baneado"){
        pollingGAS=false; sessionTokenAlumno=""; ajustarInput(false);
        $("alumno-sala-info").textContent="❌ Fuiste expulsado de la sala";
        $("alumno-sala-info").className="sala-info error";
        $("p2p-badge").style.display="none";
        if(p2pPeer){p2pPeer.desconectar();p2pPeer=null}
        p2pConectado=false;
      }
      if(e.code==="codigo_clase_requerido"){
        pollingGAS=false;
        $("gate-overlay").style.display="flex";
        localStorage.removeItem(CLAVE_GATE);
        gateToken="";
      }
    }
  });
  pollingGAS=true;
}
function detenerGAS(){CalabozosStateBridge.detenerPolling();pollingGAS=false}

/* ============================================================ POLLING DOCENTE */
function iniciarPollingDocente(sala, hostToken) {
  if (pollingDocenteId) { clearTimeout(pollingDocenteId); pollingDocenteId = null; }
  ultRevDoc = 0; ultSeqDoc = 0;
  async function tick() {
    if (!hostToken || !sala) return;
    try {
      const rj = await CalabozosStateBridge.listarJugadores(sala, hostToken);
      if (rj && rj.ok && Array.isArray(rj.jugadores)) actualizarJugadoresDesdeLista(rj.jugadores);
      const rs = await CalabozosStateBridge.syncHost(sala, hostToken, ultRevDoc, ultSeqDoc);
      if (rs && rs.ok && Array.isArray(rs.mensajes) && rs.mensajes.length) {
        ultSeqDoc = rs.ultimoSeq;
        rs.mensajes.forEach(m => {
          if (m.tipo !== "chat") return;
          if (yaEstaEnChat(m.autor, m.texto)) return;
          agregarMensaje(`🎓 ${m.autor}: ${m.texto}`, "user");
          historial.push({ role: "user", content: `[${m.autor}] ${m.texto}`, tipo: "chat" });
        });
        guardarPartida();
      }
    } catch (_) {}
    pollingDocenteId = setTimeout(tick, 3000);
  }
  tick();
}
function actualizarJugadoresDesdeLista(jugadores) {
  const e = partida.estadoJuego;
  let cambios = false;
  jugadores.forEach(j => {
    const clave = (j.jugadorId || j.nombre || j.peerId || "").toUpperCase();
    if (!clave) return;
    if (!e.jugadores[clave]) {
      e.jugadores[clave] = { x:0, y:0, mapaId:e.mapaActual, ultimaConexion:new Date().toISOString(), ultimoDado:null, peerId:j.peerId };
      cambios = true;
    } else {
      if (e.jugadores[clave].peerId !== j.peerId) { e.jugadores[clave].peerId = j.peerId; cambios = true; }
      e.jugadores[clave].ultimaConexion = new Date().toISOString();
    }
  });
  if (cambios) renderizarTodo();
}
function detenerPollingDocente() {
  if (pollingDocenteId) { clearTimeout(pollingDocenteId); pollingDocenteId = null; }
  ultRevDoc = 0; ultSeqDoc = 0;
}

/* ============================================================ PUBLICAR */
function construirSnapshot(){
  const e=partida.estadoJuego;
  return {

/* ============================================================ MICRO:BIT */
const STX=0x02,ETX=0x03;
let bufSerial=[];
async function conectarMicrobit(){
  if(!("serial" in navigator)){alert("Web Serial no disponible. Usá Chrome/Edge en PC.");return}
  try{
    microbitPort=await navigator.serial.requestPort();
    await microbitPort.open({baudRate:115200,dataBits:8,stopBits:1,parity:"none",flowControl:"none"});
    serialAbierto=true;
    $("mb-status").textContent="Conectado"; $("mb-status").style.color="var(--verde)";
    $("btn-microbit-off").disabled=false; $("btn-microbit").disabled=true;
    leerSerial();
    await enviarTrama("WEB|HELLO|"+GRUPO_RADIO);
    await enviarTrama("TX|ALL|Q|1");
  }catch(e){alert("Error micro:bit: "+e.message)}
}
async function desconectarMicrobit(){
  serialAbierto=false;
  try{if(lectorMicrobit)await lectorMicrobit.cancel()}catch(_){}
  try{await colaSerie}catch(_){}
  try{if(microbitPort)await microbitPort.close()}catch(_){}
  microbitPort=null; lectorMicrobit=null;
  $("mb-status").textContent="Sin conectar"; $("mb-status").style.color="var(--tenue)";
  $("btn-microbit-off").disabled=true; $("btn-microbit").disabled=false;
}
async function leerSerial(){
  const lector=microbitPort.readable.getReader();
  lectorMicrobit=lector;
  try{ while(serialAbierto){ const {value,done}=await lector.read(); if(done)break; for(const b of value)procesarByte(b); } }
  catch(e){log("Serial error: "+e.message)}
  finally{try{lector.releaseLock()}catch(_){}}
}
function procesarByte(b){
  if(b===STX){bufSerial=[];return}
  if(b===ETX){
    if(bufSerial.length>1){
      const datos=bufSerial.slice(0,-1);
      const chk=bufSerial[bufSerial.length-1];
      if(xor(datos)===chk){ try{procesarLinea(new TextDecoder().decode(new Uint8Array(datos)))}catch(_){} }
    }
    bufSerial=[]; return;
  }
  bufSerial.push(b);
  if(bufSerial.length>512)bufSerial=[];
}
function xor(arr){return arr.reduce((a,b)=>a^b,0)}
function procesarLinea(linea){
  const p=linea.split("|");
  if(p[0]==="RX"&&p.length>=3){
    const id=txt(p[1],12).toUpperCase(), cmd=txt(p[2],8).toUpperCase(), val=txt(p.slice(3).join("|"),80);
    if(!id||!cmd)return;
    if(!partida.estadoJuego.jugadores[id]){
      partida.estadoJuego.jugadores[id]={x:0,y:0,mapaId:partida.estadoJuego.mapaActual,ultimaConexion:ahora(),peerId:null};
    }
    partida.estadoJuego.jugadores[id].ultimaConexion=ahora();
    if(cmd==="D"){
      partida.estadoJuego.ultimoDado={jugador:id,valor:Number(val)};
      partida.estadoJuego.ultimoEvento=`${id} obtuvo ${val}.`;
      publicarEstado("dado");
    }else if(cmd==="M"){
      const d={N:[0,-1],S:[0,1],E:[1,0],O:[-1,0]}[val];
      if(d){
        const j=partida.estadoJuego.jugadores[id];
        j.x=Math.max(0,Math.min(TAM_MAPA-1,j.x+d[0]));
        j.y=Math.max(0,Math.min(TAM_MAPA-1,j.y+d[1]));
        publicarEstado("movimiento");
      }
    }else if(cmd==="J"){
      partida.estadoJuego.ultimoEvento=`${id} se unió.`;
      publicarEstado("join");
    }else if(cmd==="A"){
      partida.estadoJuego.ultimoEvento=`${id}: ${val}.`;
      publicarEstado("accion");
    }
    renderizarTodo();
  }else if(p[0]==="GW"&&p[1]==="READY")log("Gateway listo (grupo "+p[2]+")");
  else if(p[0]==="TXOK")log("Radio enviada a "+p[1]);
}
async function enviarTrama(linea){
  if(!serialAbierto||!microbitPort)return;
  const data=new TextEncoder().encode(linea);
  const trama=new Uint8Array([STX,...data,xor([...data]),ETX]);
  colaSerie=colaSerie.then(async()=>{ const w=microbitPort.writable.getWriter(); try{await w.write(trama)}finally{w.releaseLock()} });
  return colaSerie;
}

      onPeerMessage:(id,msg)=>procesarMensajeP2PPeer(id,msg),
      onPeerDisconnected:()=>{actualizarContadorP2P();renderizarTodo()},
      onHostRevoked:()=>{ if(p2pHost){p2pHost.broadcast({tipo:"host-changed"});setTimeout(()=>{if(p2pHost){p2pHost.stop();p2pHost=null}},150)} agregarMensaje("⚠ Ya no sos host","system"); resetearBotonesDocente(); }
    });
    p2pHost.start();
    iniciarPollingDocente(codigoSala, sessionTokenDocente);
    $("btn-crear").hidden=true; $("btn-traspaso").style.display="inline-block"; $("btn-cerrar-sala").style.display="inline-block";
    mostrarInfoSala();
    publicarEstado("host-traspasado");
    alert("¡Ahora sos el host!");
  }catch(e){alert("Error: "+e.message)}
}

async function recuperarHost(){
  if(!codigoSala){alert("Ingresá el código de la sala primero");return}
  const tok = await pedirPinDocente();
  if(!tok) return;
  try{
    const r1 = await CalabozosStateBridge.solicitarRecuperacion(codigoSala, tok);
    if(!r1.ok){
      const msgs={ "pin_requerido":"PIN requerido", "publicaciones_recientes":"La sala tuvo publicaciones recientes. Esperá 90s.", "sala_invalida":"La sala expiró" };
      throw new Error(msgs[r1.error]||r1.error);
    }
    let estadoOriginal=null;
    try{ const sr = await CalabozosStateBridge.syncDocente(codigoSala, tok); if(sr.ok&&sr.estado) estadoOriginal=sr.estado; }catch(_){}
    if(!estadoOriginal||!validarEstadoOriginal(estadoOriginal)){ alert("No se pudo leer un estado válido. El host anterior sigue activo."); return; }
    const estadoRecuperado = normalizarEstado(estadoOriginal);
    const r2 = await CalabozosStateBridge.confirmarRecuperacion(codigoSala, r1.ticket, tok);
    if(!r2.ok){
      const msgs={ "ticket_expirado":"El ticket expiró. Reintentá.", "ticket_invalido":"Ticket inválido", "pin_requerido":"PIN incorrecto", "estado_no_recuperable":"El estado del servidor no es recuperable." };
      throw new Error(msgs[r2.error]||r2.error);
    }
    sessionTokenDocente = r2.hostToken;
    localStorage.setItem("calabozos.hostToken", sessionTokenDocente);
    partida.estadoJuego = estadoRecuperado;
    guardarPartida();
    modo = "docente"; aplicarModoVisual();
    if(p2pPeer){p2pPeer.desconectar();p2pPeer=null}
    if(pollingGAS){CalabozosStateBridge.detenerPolling();pollingGAS=false}
    p2pHost = new CalabozosStateBridge.P2PHost(codigoSala, sessionTokenDocente, {
      onPeerConnected: (id,name,jid)=>{ agregarMensaje(`🔗 ${name} conectado`,"system"); const clave=(jid||name||id).toUpperCase(); if(!partida.estadoJuego.jugadores[clave]) partida.estadoJuego.jugadores[clave]={x:0,y:0,mapaId:partida.estadoJuego.mapaActual,ultimaConexion:new Date().toISOString(),ultimoDado:null,peerId:id}; enviarEstadoPorP2P(id); actualizarContadorP2P(); renderizarTodo(); },
      onPeerMessage: (id,msg)=>procesarMensajeP2PPeer(id,msg),
      onPeerDisconnected: ()=>{actualizarContadorP2P();renderizarTodo()},
      onHostRevoked: ()=>{ if(p2pHost){p2pHost.stop();p2pHost=null} agregarMensaje("⚠ Ya no sos host","system"); resetearBotonesDocente(); }
    });
    p2pHost.start();
    iniciarPollingDocente(codigoSala, sessionTokenDocente);
    $("btn-crear").hidden=true; $("btn-traspaso").style.display="inline-block"; $("btn-cerrar-sala").style.display="inline-block";
    mostrarInfoSala();
    publicarEstado("host-recuperado");
    $("btn-recuperar-host").style.display = "none";
    alert("¡Recuperaste el control!");
  }catch(e){alert("Error: "+e.message)}
}

/* ============================================================ ARRANQUE */
async function inicializarApp(){
  detectarModo();
  aplicarModoVisual();
  $("cfg-ollama").value = (localStorage.getItem(CLAVE_OLLAMA)||"").replace(/^https?:\/\//,"").replace(/:11434$/,"");
  CalabozosStateBridge.configurar({ appsScriptUrl: CONFIG.appsScriptUrl });
  renderizarTodo();

  try {
    const w = await CalabozosStateBridge.whoami();
    if (!w.accesoConfigurado) {
      log("⚠ El servidor no tiene CLASS_CODE/ADMIN_PIN configurados. Ejecutá configurarAcceso() en Apps Script.");
    }
  } catch(_) {}

  if (modo === "docente") {
    iniciarOllama();
  } else {
    ajustarInput(false);
    const sala = new URLSearchParams(location.search).get("sala");
    if (sala) { $("input-sala").value = sala.toUpperCase(); unirseSalaAlumno(); }
    $("btn-canjear").style.display = "inline-block";
  }
}

window.addEventListener("DOMContentLoaded", () => {
  // Si ya hay gateToken, ocultar overlay e inicializar. Si no, esperar a ingresarClase().
  if (gateToken) {
    $("gate-overlay").style.display = "none";
    inicializarApp();
  } else {
    $("gate-input").addEventListener("keypress", e => { if(e.key==="Enter") ingresarClase(); });
    setTimeout(()=>{ try{$("gate-input").focus()}catch(_){} }, 100);
  }
});

window.addEventListener("resize",()=>{chat.scrollTop=chat.scrollHeight});
</script>
