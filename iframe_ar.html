<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Multi Marcador (Hiro, Kanji, Barcode 4x4 BCH)</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/zlibjs@0.3.1/bin/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        #camera-error {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            color: white; padding: 18px 24px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px; font-weight: 600;
            z-index: 5000; text-align: center;
            max-width: 90vw; display: none;
        }
        #camera-error.visible { display: block; }

        #js-error {
            position: fixed; top: 0; left: 0; right: 0;
            background: #dc3545; color: white;
            padding: 10px 14px;
            font-family: monospace; font-size: 12px;
            z-index: 99999; display: none;
            white-space: pre-wrap; word-break: break-word;
        }
        #js-error.visible { display: block; }

        #panel-info.hidden { display: none !important; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="js-error"></div>

    <div id="panel-info">
        <h3>Panel AR</h3>
        <p>Marcador: <span id="marcador-id">Ninguno</span></p>
        <p>Modelo: <span id="modelo-id">-</span></p>
        <p>Estado: <span id="estado-id">Buscando...</span></p>
        <p>FPS: <span id="fps-id">0</span></p>
    </div>

    <div id="panel-historia" style="position:fixed; bottom:0; left:0; right:0; max-height:30%; overflow-y:auto; background:rgba(0,0,0,0.7); color:#fff; padding:10px; font-family:sans-serif;"></div>

    <div id="camera-error">⚠️ No se pudo acceder a la cámara.<br>Verificá los permisos del navegador y que estés usando HTTPS.</div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              detectionMode: mono_and_matrix;
              matrixCodeType: 4x4_BCH_13_5_5;
              trackingMethod:best;">

        <a-assets>
            <a-asset-item id="modelo-dragon-glb" src="modelos/dragon.glb"></a-asset-item>
            <a-asset-item id="modelo-mago-glb" src="modelos/mago.glb"></a-asset-item>
            <a-asset-item id="modelo-model-glb" src="modelos/model.glb"></a-asset-item>
            <img id="imgDragon" src="modelos/demo.png">
            <video id="videoEjemplo" src="modelos/ejemplo.mp4" preload="auto" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <video id="videoEjemplo2" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <video id="Tablero" src="modelos/tablero.mp4" preload="auto" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <img id="arbol1" src="modelos/arbol1.png">
            <img id="arbol2" src="modelos/arbol2.png">
            <a-asset-item id="modelo-naturaleza-glb" src="modelos/Naturaleza.glb"></a-asset-item>
            <a-asset-item id="desierto-glb" src="modelos/Desierto.glb"></a-asset-item>
            <a-asset-item id="esqueleto-glb" src="modelos/esqueleto_animado.glb"></a-asset-item>
            <a-asset-item id="evil-glb" src="modelos/evil.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="Hiro" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-dragon-glb"
                position="0 0 0"
                scale="0.1 0.1 0.1"
                animation="property: rotation; to: 0 10 0; dur: 3000; easing: linear; loop: true"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker preset="kanji" id="Kanji" registerevents>
            <a-entity class="model-entity"
                fbx-model="src: url(modelos/dragon.fbx)"
                position="0 0 0"
                scale="0.1 0.1 0.1"
                animation="property: rotation; to: 0 10 0; dur: 3000; easing: linear; loop: true"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="0" id="Barcode_0" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-mago-glb"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.5 0.5 0.5"
                animation-mixer></a-entity>
            <a-plane position="0 1.2 -0.01" rotation="-90 0 0" width="2.8" height="0.5" color="black" opacity="0.7"></a-plane>
            <a-text value="Nombre: Mago\nNivel: 20\nVida: 350" position="0 1.3 0" rotation="-90 0 0" color="white" align="center" width="3"></a-text>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="1" id="Barcode_1" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-entity"
                fbx-model="src: url(modelos/mago.fbx)"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.01 0.01 0.01"
                animation-mixer="clip: *; loop: repeat"></a-entity>
            <a-text value="Mago" position="0 1 0" look-at="[camera]" align="center" color="yellow" width="2"></a-text>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="2" id="Barcode_2" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-model-glb"
                position="0 0 0"
                rotation="-90 0 0"
                scale="2 2 2"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="3" id="Barcode_3" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 1; height: 1"
                material="shader:gif; src:url(modelos/fuego.gif)"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="4" id="Barcode_4" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 1.5; height: 1.5"
                material="src: #imgDragon"
                position="0 0.8 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="5" id="Barcode_5" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 2; height: 1.2"
                material="src: #videoEjemplo"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-text value="Ejemplo.mp4" position="0 -0.25 0.03" look-at="[camera]" align="center" color="yellow" width="2"></a-text>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="6" id="Barcode_6" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 2; height: 1.2"
                material="src: #videoEjemplo2"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="7" id="Barcode_7" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 1.125; height: 2"
                material="src: #Tablero"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="8" id="Barcode_8" registerevents>
            <a-entity class="model-entity">
                <a-entity position="-0.8 0 -0.3">
                    <a-plane src="#arbol1" transparent="true" alpha-test="0.5" width="3" height="3" position="0 0.65 0" rotation="0 45 0"></a-plane>
                    <a-plane src="#arbol1" transparent="true" alpha-test="0.5" width="3" height="3" position="0 0.65 0" rotation="0 -45 0"></a-plane>
                </a-entity>
                <a-entity position="0.9 0 0.5">
                    <a-plane src="#arbol2" transparent="true" alpha-test="0.5" width="3" height="3" position="0 0.55 0" rotation="0 45 0"></a-plane>
                    <a-plane src="#arbol2" transparent="true" alpha-test="0.5" width="3" height="3" position="0 0.55 0" rotation="0 -45 0"></a-plane>
                </a-entity>
            </a-entity>
            <a-entity class="stats-slot" position="0 2 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="9" id="Barcode_9" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-naturaleza-glb"
                position="0 0 0"
                rotation="-90 5 0"
                scale="2 2 2"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="10" id="Barcode_10" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-entity"
                gltf-model="#esqueleto-glb"
                position="0 0 0"
                rotation="-60 0 0"
                scale="1 1 1"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="11" id="Barcode_11" smooth="true" smoothCount="15" smoothTolerance="0.1" smoothThreshold="3" registerevents>
            <a-entity class="model-entity"
                gltf-model="#evil-glb"
                position="0 0 0"
                rotation="-60 0 0"
                scale="100 100 100"
                animation-mixer="clip: *; loop: repeat"></a-entity>
            <a-entity class="stats-slot" position="0 2 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- ✅ FIX: scripts al final del body, SIN defer, en orden garantizado -->
    <script src="js/utilidades.js"></script>
    <script src="js/eventos.js"></script>

    <script>
        // ==================================================
        // CAPTURA DE ERRORES VISIBLE EN PANTALLA
        // ==================================================
        window.addEventListener('error', function (e) {
            const box = document.getElementById('js-error');
            if (!box) return;
            box.textContent = '❌ JS ERROR: ' + (e.message || e.error || 'desconocido') +
                (e.filename ? '\n   en ' + e.filename + ':' + e.lineno : '');
            box.classList.add('visible');
            console.error('[AR] JS error:', e.message, e.filename, e.lineno);
        });
        window.addEventListener('unhandledrejection', function (e) {
            const box = document.getElementById('js-error');
            if (!box) return;
            const r = e.reason;
            box.textContent = '❌ PROMISE REJECTION: ' + (r && r.message ? r.message : r);
            box.classList.add('visible');
            console.error('[AR] Unhandled rejection:', r);
        });

        // ==================================================
        // DIAGNÓSTICO INICIAL
        // ==================================================
        if (typeof AFRAME === 'undefined') {
            console.error('[AR] AFRAME no cargado desde CDN');
        } else {
            console.log('[AR] A-Frame OK, versión:', AFRAME.version);
        }
        if (typeof Utilidades === 'undefined') {
            console.error('[AR] Utilidades no cargada desde js/utilidades.js');
        } else {
            console.log('[AR] Utilidades OK');
        }
        if (typeof Comunicacion === 'undefined') {
            console.error('[AR] Comunicacion no definida');
        } else {
            console.log('[AR] Comunicacion OK');
        }

        // ==================================================
        // LISTENER DE COMANDOS DEL DM (padre)
        // ==================================================
        window.addEventListener('message', function (e) {
            if (!e.data || e.data.target !== 'ar-frame') return;
            const cmd = e.data;
            console.log('[AR] Comando recibido del DM:', cmd);

            if (typeof Utilidades === 'undefined') {
                console.warn('[AR] Utilidades no disponible, ignorando:', cmd.action);
                return;
            }

            try {
                switch (cmd.action) {
                    case 'assign-model':
                        Utilidades.asignarModelo(cmd.slot, {
                            type: cmd.modelType || 'gltf',
                            url: cmd.modelUrl,
                            name: cmd.modelName || 'Modelo',
                            scale: cmd.scale,
                            rotation: cmd.rotation,
                            position: cmd.position,
                            animated: cmd.animated !== false
                        });
                        break;
                    case 'show-model': Utilidades.mostrarModelo(cmd.slot, true); break;
                    case 'hide-model': Utilidades.mostrarModelo(cmd.slot, false); break;
                    case 'assign-stats': Utilidades.asignarStats(cmd.slot, cmd.stats); break;
                    case 'clear-stats': Utilidades.limpiarStats(cmd.slot); break;
                    case 'clear-model': Utilidades.limpiarModelo(cmd.slot); break;
                    case 'toggle-panel': Utilidades.togglePanel(cmd.visible); break;
                    default: console.warn('[AR] Comando desconocido:', cmd.action);
                }
            } catch (err) {
                console.warn('[AR] Error ejecutando comando:', err);
            }
        });

        // ==================================================
        // ARRANQUE: avisar al padre cuando la escena cargue
        // ==================================================
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof Utilidades !== 'undefined' && Utilidades.iniciarFPS) {
                Utilidades.iniciarFPS();
            }
        });

        const scene = document.querySelector('a-scene');
        if (scene) {
            const avisar = function () {
                if (typeof Comunicacion !== 'undefined') {
                    console.log('[AR] Enviando ar-frame-ready al padre');
                    Comunicacion.enviarAlPadre({ action: 'ar-frame-ready' });
                } else {
                    console.warn('[AR] No puedo enviar ar-frame-ready: Comunicacion no existe');
                }
            };
            if (scene.hasLoaded) setTimeout(avisar, 300);
            else scene.addEventListener('loaded', function () { setTimeout(avisar, 300); });

            scene.addEventListener('camera-error', function () {
                const el = document.getElementById('camera-error');
                if (el) el.classList.add('visible');
            });
            scene.addEventListener('arjs-video-loaded', function () {
                const el = document.getElementById('camera-error');
                if (el) el.classList.remove('visible');
                console.log('[AR] Cámara cargada OK');
            });
        }

        document.addEventListener("click", function () {
            const t = document.getElementById('Tablero');
            if (t) t.muted = !t.muted;
        });
    </script>
</body>
</html>
