<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Calabozos y Código</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/zlibjs@0.3.1/bin/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        #panel-info-toggle {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 15, 20, 0.9);
            color: #ffd700;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
        }
        #panel-info-toggle:hover { background: rgba(30, 30, 40, 0.95); }
        #panel-info.hidden { display: none !important; }

        #camera-error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            color: white;
            padding: 18px 24px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            z-index: 5000;
            text-align: center;
            max-width: 90vw;
            display: none;
        }
        #camera-error.visible { display: block; }
    </style>

    <script>
        AFRAME.registerComponent('fix-fbx-material', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    obj.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.emissive.setHex(0x222222);
                            child.material.needsUpdate = true;
                        }
                    });
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="panel-info">
        <h3>Panel AR</h3>
        <p>Marcador: <span id="marcador-id">Ninguno</span></p>
        <p>Modelo: <span id="modelo-id">-</span></p>
        <p>Estado: <span id="estado-id">Buscando...</span></p>
        <p>FPS: <span id="fps-id">0</span></p>
    </div>
    <button id="panel-info-toggle" type="button" onclick="Utilidades.togglePanel()">Ocultar panel</button>

    <div id="camera-error">
        ⚠️ No se pudo acceder a la cámara.<br>
        Verificá los permisos del navegador y que estés usando HTTPS.
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              detectionMode: mono_and_matrix;
              matrixCodeType: 4x4_BCH_13_5_5;
              trackingMethod: best;">

        <a-assets>
            <a-asset-item id="modelo-dragon-glb" src="modelos/dragon.glb"></a-asset-item>
            <a-asset-item id="modelo-mago-glb" src="modelos/mago.glb"></a-asset-item>
            <a-asset-item id="modelo-model-glb" src="modelos/model.glb"></a-asset-item>
            <img id="imgDragon" src="modelos/demo.png" crossorigin="anonymous">
            <video id="videoEjemplo" src="modelos/ejemplo.mp4" preload="auto" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <video id="videoEjemplo2" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <video id="Tablero" src="modelos/tablero.mp4" preload="auto" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <img id="arbol1" src="modelos/arbol1.png" crossorigin="anonymous">
            <img id="arbol2" src="modelos/arbol2.png" crossorigin="anonymous">
            <a-asset-item id="modelo-naturaleza-glb" src="modelos/Naturaleza.glb"></a-asset-item>
            <a-asset-item id="desierto-glb" src="modelos/Desierto.glb"></a-asset-item>
            <a-asset-item id="esqueleto-glb" src="modelos/esqueleto_animado.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="marker-hiro" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker preset="kanji" id="marker-kanji" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="0" id="marker-0" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="1" id="marker-1" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="2" id="marker-2" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="3" id="marker-3" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="4" id="marker-4" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="5" id="marker-5" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="6" id="marker-6" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="7" id="marker-7" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="8" id="marker-8" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 2 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="9" id="marker-9" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="10" id="marker-10" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 1.5 0"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="11" id="marker-11" smooth="true" smoothCount="15" smoothTolerance="0.1" smoothThreshold="3" registerevents>
            <a-entity class="model-slot" visible="false"></a-entity>
            <a-entity class="stats-slot" visible="false" look-at="[camera]" position="0 2 0"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="js/conexion.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/eventos.js"></script>

    <script>
        document.addEventListener("click", () => {
            const t = document.getElementById('Tablero');
            if (t) t.muted = !t.muted;
        });

        // Diagnóstico: mostrar mensaje si la cámara falla
        const scene = document.querySelector('a-scene');
        if (scene) {
            scene.addEventListener('camera-error', () => {
                const el = document.getElementById('camera-error');
                if (el) el.classList.add('visible');
                console.error('[AR] No se pudo acceder a la cámara');
                if (window.Utilidades) Utilidades.ocultarTodosSlots();
            });
            scene.addEventListener('arjs-video-loaded', () => {
                const el = document.getElementById('camera-error');
                if (el) el.classList.remove('visible');
                console.log('[AR] Cámara cargada correctamente');
            });
        }
    </script>
</body>
</html>
