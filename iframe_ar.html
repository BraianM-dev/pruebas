<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Multi Marcador (Hiro, Kanji, Barcode 4x4 BCH)</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Requerido por FBXLoader para descomprimir geometría -->
    <script src="https://cdn.jsdelivr.net/npm/zlibjs@0.3.1/bin/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <!-- Requerido para seguir la cámara -->
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
    <!-- Requerido para que el gif funcione -->
    <script src="https://unpkg.com/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

    <!-- Varias copias del mismo marcador a la vez (árboles del código 8) -->
    <script src="js/multi-marcador.js"></script>
    <!-- Modelos sin parpadeo (medio segundo de margen) + barrita de tamaño general -->
    <script src="js/marcadores-estables.js"></script>
    <!-- Click derecho: los personajes caminan; si quedan cara a cara, pelean -->
    <script src="js/acciones.js"></script>
    <!-- Sonidos: pasos, golpes, bola de fuego, ambiente de mazmorra (botón "Sonido") -->
    <script src="js/sonidos.js"></script>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        #camera-error {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.95);
            color: white; padding: 18px 24px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px; font-weight: 600;
            z-index: 5000; text-align: center;
            max-width: 90vw; display: none;
        }
        #camera-error.visible { display: block; }

        #js-error {
            position: fixed; top: 0; left: 0; right: 0;
            background: #dc3545; color: white;
            padding: 10px 14px;
            font-family: monospace; font-size: 12px;
            z-index: 99999; display: none;
            white-space: pre-wrap; word-break: break-word;
        }
        #js-error.visible { display: block; }

        #panel-info.hidden,
        .ar-ui-oculta {
            display: none !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="js-error"></div>

    <!-- Panel de información en pantalla (lo maneja utilidades.js) -->
    <div id="panel-info">
        <h3>Panel AR</h3>
        <p>Marcador: <span id="marcador-id">Ninguno</span></p>
        <p>Modelo: <span id="modelo-id">-</span></p>
        <p>Estado: <span id="estado-id">Buscando...</span></p>
        <p>FPS: <span id="fps-id">0</span></p>
    </div>

    <!-- Panel para el texto del Dungeon Master -->
    <div id="panel-historia" style="position:fixed; bottom:0; left:0; right:0; max-height:30%; overflow-y:auto; background:rgba(0,0,0,0.7); color:#fff; padding:10px; font-family:sans-serif;"></div>

    <div id="camera-error">⚠️ No se pudo acceder a la cámara.<br>Verificá los permisos del navegador y que estés usando HTTPS.</div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              detectionMode: mono_and_matrix;
              matrixCodeType: 4x4_BCH_13_5_5;
              trackingMethod:best;">

        <a-assets timeout="5000">
            <a-asset-item id="modelo-dragon-glb" src="modelos/dragon.glb"></a-asset-item>
            <a-asset-item id="modelo-mago-glb" src="modelos/mago.glb"></a-asset-item>
            <a-asset-item id="modelo-model-glb" src="modelos/model.glb"></a-asset-item>
            <img id="imgDragon" src="modelos/demo.png">
            <video id="videoEjemplo" src="modelos/ejemplo.mp4" preload="auto" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <video id="videoEjemplo2" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <video id="Tablero" src="modelos/tablero.mp4" preload="auto" autoplay loop muted playsinline crossorigin="anonymous"></video>
            <img id="arbol1" src="modelos/arbol1.png">
            <img id="arbol2" src="modelos/arbol2.png">
            <a-asset-item id="modelo-naturaleza-glb" src="modelos/Naturaleza.glb"></a-asset-item>
            <a-asset-item id="desierto-glb" src="modelos/Desierto.glb"></a-asset-item>
            <a-asset-item id="esqueleto-glb" src="modelos/esqueleto_animado.glb"></a-asset-item>
            <a-asset-item id="evil-glb" src="modelos/evil.glb"></a-asset-item>
        </a-assets>

        <!-- Marcador de patrón: Hiro -->
        <a-marker preset="hiro" id="Hiro" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-dragon-glb"
                position="0 0 0"
                scale="0.1 0.1 0.1"
                animation="property: rotation; to: 0 10 0; dur: 3000; easing: linear; loop: true"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador de patrón: Kanji -->
        <a-marker preset="kanji" id="Kanji" registerevents>
            <a-entity class="model-entity"
                fbx-model="src: url(modelos/dragon.fbx)"
                position="0 0 0"
                scale="0.1 0.1 0.1"
                animation="property: rotation; to: 0 10 0; dur: 3000; easing: linear; loop: true"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 0 -->
        <a-marker type="barcode" value="0" id="Barcode_0" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-mago-glb"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.5 0.5 0.5"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 1 -->
        <a-marker type="barcode" value="1" id="Barcode_1" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-entity"
                fbx-model="src: url(modelos/mago.fbx)"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.01 0.01 0.01"
                animation-mixer="clip: *; loop: repeat"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 2 -->
        <a-marker type="barcode" value="2" id="Barcode_2" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-model-glb"
                position="0 0 0"
                rotation="-90 0 0"
                scale="2 2 2"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 3 -->
        <a-marker type="barcode" value="3" id="Barcode_3" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 1; height: 1"
                material="shader:gif; src:url(modelos/fuego.gif)"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 4 Imagen PNG -->
        <a-marker type="barcode" value="4" id="Barcode_4" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 1.5; height: 1.5"
                material="src: #imgDragon"
                position="0 0.8 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 5 Video MP4 -->
        <a-marker type="barcode" value="5" id="Barcode_5" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 2; height: 1.2"
                material="src: #videoEjemplo"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 6 Video MP4 desde URL -->
        <a-marker type="barcode" value="6" id="Barcode_6" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 2; height: 1.2"
                material="src: #videoEjemplo2"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 7 Video Tablero -->
        <a-marker type="barcode" value="7" id="Barcode_7" registerevents>
            <a-entity class="model-entity"
                geometry="primitive: plane; width: 1.125; height: 2"
                material="src: #Tablero"
                position="0 0.5 0"
                rotation="-90 0 0"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 8: ÁRBOLES (multi-marcador) -->
        <a-entity id="Barcode_8" multi-marcador="valor: 8" registerevents>
            <!-- Árbol A -->
            <a-entity>
                <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; easing: linear; loop: true">
                    <a-plane src="#arbol1" transparent="true" alpha-test="0.5" side="double" width="2" height="2" position="0 1 0" rotation="0 45 0"></a-plane>
                    <a-plane src="#arbol1" transparent="true" alpha-test="0.5" side="double" width="2" height="2" position="0 1 0" rotation="0 -45 0"></a-plane>
                </a-entity>
            </a-entity>
            <!-- Árbol B -->
            <a-entity>
                <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; easing: linear; loop: true">
                    <a-plane src="#arbol2" transparent="true" alpha-test="0.5" side="double" width="1.86" height="2" position="0 1 0" rotation="0 45 0"></a-plane>
                    <a-plane src="#arbol2" transparent="true" alpha-test="0.5" side="double" width="1.86" height="2" position="0 1 0" rotation="0 -45 0"></a-plane>
                </a-entity>
            </a-entity>
            <!-- Árbol C -->
            <a-entity>
                <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; easing: linear; loop: true">
                    <a-plane src="#arbol1" transparent="true" alpha-test="0.5" side="double" width="2" height="2" position="0 1 0" rotation="0 45 0"></a-plane>
                    <a-plane src="#arbol1" transparent="true" alpha-test="0.5" side="double" width="2" height="2" position="0 1 0" rotation="0 -45 0"></a-plane>
                </a-entity>
            </a-entity>
            <!-- Árbol D -->
            <a-entity>
                <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; easing: linear; loop: true">
                    <a-plane src="#arbol2" transparent="true" alpha-test="0.5" side="double" width="1.86" height="2" position="0 1 0" rotation="0 45 0"></a-plane>
                    <a-plane src="#arbol2" transparent="true" alpha-test="0.5" side="double" width="1.86" height="2" position="0 1 0" rotation="0 -45 0"></a-plane>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 9 -->
        <a-marker type="barcode" value="9" id="Barcode_9" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-entity"
                gltf-model="#modelo-naturaleza-glb"
                position="0 0 0"
                rotation="-90 5 0"
                scale="2 2 2"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 10 -->
        <a-marker type="barcode" value="10" id="Barcode_10" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5" registerevents>
            <a-entity class="model-entity"
                gltf-model="#esqueleto-glb"
                position="0 0 0"
                rotation="-60 0 0"
                scale="1 1 1"
                animation-mixer></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 11 -->
        <a-marker type="barcode" value="11" id="Barcode_11" smooth="true" smoothCount="15" smoothTolerance="0.1" smoothThreshold="3" registerevents>
            <a-entity class="model-entity"
                gltf-model="#evil-glb"
                position="0 0 0"
                rotation="-60 0 0"
                scale="100 100 100"
                animation-mixer="clip: *; loop: repeat"></a-entity>
            <a-entity class="stats-slot" position="0 2 0" look-at="[camera]"></a-entity>
        </a-marker>

        <!-- ====== MODELOS KAYKIT (marcadores 12 a 31) ====== -->
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 12: Caballero -->
        <a-marker type="barcode" value="12" id="Barcode_12" registerevents>
            <a-entity class="model-entity personaje" data-bando="heroe" gltf-model="url(modelos/kaykit/caballero.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 13: Bárbaro -->
        <a-marker type="barcode" value="13" id="Barcode_13" registerevents>
            <a-entity class="model-entity personaje" data-bando="heroe" gltf-model="url(modelos/kaykit/barbaro.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 14: Mago -->
        <a-marker type="barcode" value="14" id="Barcode_14" registerevents>
            <a-entity class="model-entity personaje" data-bando="heroe" data-hechizos="bola-de-fuego" gltf-model="url(modelos/kaykit/mago.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 15: Pícaro -->
        <a-marker type="barcode" value="15" id="Barcode_15" registerevents>
            <a-entity class="model-entity personaje" data-bando="heroe" gltf-model="url(modelos/kaykit/picaro.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 16: Encapuchado -->
        <a-marker type="barcode" value="16" id="Barcode_16" registerevents>
            <a-entity class="model-entity personaje" data-bando="heroe" gltf-model="url(modelos/kaykit/encapuchado.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 17: Esqueleto guerrero -->
        <a-marker type="barcode" value="17" id="Barcode_17" registerevents>
            <a-entity class="model-entity personaje" data-bando="malo" gltf-model="url(modelos/kaykit/esqueleto_guerrero.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 18: Esqueleto mago -->
        <a-marker type="barcode" value="18" id="Barcode_18" registerevents>
            <a-entity class="model-entity personaje" data-bando="malo" gltf-model="url(modelos/kaykit/esqueleto_mago.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 19: Esqueleto pícaro -->
        <a-marker type="barcode" value="19" id="Barcode_19" registerevents>
            <a-entity class="model-entity personaje" data-bando="malo" gltf-model="url(modelos/kaykit/esqueleto_picaro.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 20: Esqueleto esbirro -->
        <a-marker type="barcode" value="20" id="Barcode_20" registerevents>
            <a-entity class="model-entity personaje" data-bando="malo" gltf-model="url(modelos/kaykit/esqueleto_esbirro.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5" animation-mixer="clip: Quieto"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 21: Cofre -->
        <a-marker type="barcode" value="21" id="Barcode_21" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/cofre.glb)" position="0 0 0" rotation="0 0 0" scale="0.6 0.6 0.6"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 22: Ataúd -->
        <a-marker type="barcode" value="22" id="Barcode_22" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/ataud.glb)" position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 23: Barril -->
        <a-marker type="barcode" value="23" id="Barcode_23" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/barril.glb)" position="0 0 0" rotation="0 0 0" scale="0.45 0.45 0.45"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 24: Antorcha -->
        <a-marker type="barcode" value="24" id="Barcode_24" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/antorcha.glb)" position="0 0.52 0" rotation="0 0 0" scale="1.3 1.3 1.3"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 25: Monedas -->
        <a-marker type="barcode" value="25" id="Barcode_25" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/monedas.glb)" position="0 0 0" rotation="0 0 0" scale="0.6 0.6 0.6"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 26: Espada y escudo -->
        <a-marker type="barcode" value="26" id="Barcode_26" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/espada_escudo.glb)" position="0 0.58 0" rotation="0 0 0" scale="0.7 0.7 0.7"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 27: Llave -->
        <a-marker type="barcode" value="27" id="Barcode_27" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/llave.glb)" position="0 0.3 0" rotation="0 0 0" scale="1.5 1.5 1.5"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 28: Árbol -->
        <a-marker type="barcode" value="28" id="Barcode_28" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/arbol.glb)" position="0 0 0" rotation="0 0 0" scale="1.4 1.4 1.4"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 29: Pino de otoño -->
        <a-marker type="barcode" value="29" id="Barcode_29" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/pino_otono.glb)" position="0 0 0" rotation="0 0 0" scale="0.25 0.25 0.25"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 30: Árbol seco -->
        <a-marker type="barcode" value="30" id="Barcode_30" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/arbol_seco.glb)" position="0 0 0" rotation="0 0 0" scale="0.35 0.35 0.35"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>
        <!-- Marcador barcode 4x4 BCH 13,5,5, valor 31: Tumba -->
        <a-marker type="barcode" value="31" id="Barcode_31" registerevents>
            <a-entity class="model-entity" gltf-model="url(modelos/kaykit/tumba.glb)" position="0 0 0" rotation="0 0 0" scale="0.6 0.6 0.6"></a-entity>
            <a-entity class="stats-slot" position="0 1.5 0" look-at="[camera]"></a-entity>
        </a-marker>

        <a-entity camera look-controls="enabled: false" wasd-controls="enabled: false" position="0 0 0"></a-entity>
    </a-scene>

    <!-- Scripts al final del body, en orden garantizado -->
    <script src="js/utilidades.js"></script>
    <script src="js/eventos.js"></script>

    <script>
        // ==================================================
        // CAPTURA DE ERRORES (ignora eventos de assets 404)
        // ==================================================
        window.addEventListener('error', function (e) {
            const box = document.getElementById('js-error');
            if (!box || !e.message) return;
            box.textContent = '❌ JS ERROR: ' + e.message +
                (e.filename ? '\n   en ' + e.filename + ':' + e.lineno : '');
            box.classList.add('visible');
            console.error('[AR] JS error:', e.message, e.filename, e.lineno);
        });
        window.addEventListener('unhandledrejection', function (e) {
            const r = e.reason;
            if (r instanceof Event) {
                console.warn('[AR] Recurso no cargado en <a-assets>:', r.target && r.target.src ? r.target.src : r);
                return;
            }
            const box = document.getElementById('js-error');
            if (!box) return;
            box.textContent = '❌ PROMISE REJECTION: ' + (r && r.message ? r.message : r);
            box.classList.add('visible');
            console.error('[AR] Unhandled rejection:', r);
        });

        // ==================================================
        // DIAGNÓSTICO INICIAL
        // ==================================================
        if (typeof AFRAME === 'undefined') {
            console.error('[AR] AFRAME no cargado desde CDN');
        } else {
            console.log('[AR] A-Frame OK, versión:', AFRAME.version);
        }
        if (typeof Utilidades === 'undefined') {
            console.error('[AR] Utilidades no cargada desde js/utilidades.js');
        } else {
            console.log('[AR] Utilidades OK');
        }
        if (typeof Comunicacion === 'undefined') {
            console.error('[AR] Comunicacion no definida');
        } else {
            console.log('[AR] Comunicacion OK');
        }

        // ==================================================
        // LIMPIAR HIJOS SUELTOS DEL MARKER
        // ==================================================
        function limpiarHijosSueltos(slot) {
            if (typeof Utilidades === 'undefined') return;
            const marker = Utilidades.markerElPorSlot(slot);
            if (!marker) return;
            Array.from(marker.children).forEach(function (child) {
                if (child.classList.contains('model-entity')) return;
                if (child.classList.contains('stats-slot')) return;
                try { marker.removeChild(child); } catch (_) {}
            });
        }

        // ==================================================
        // OCULTAR / MOSTRAR PANEL AR + PANEL DE PASOS, TAMAÑO Y SONIDO
        // ==================================================
        function togglePanelesAR(visibleForzado) {
            const panelInfo = document.getElementById('panel-info');

            if (typeof Utilidades !== 'undefined' && Utilidades.togglePanel) {
                Utilidades.togglePanel(visibleForzado);
            } else if (panelInfo) {
                if (visibleForzado === undefined) panelInfo.classList.toggle('hidden');
                else panelInfo.classList.toggle('hidden', !visibleForzado);
            }

            const estaOculto = panelInfo
                ? (panelInfo.classList.contains('hidden') || panelInfo.style.display === 'none')
                : false;
            const ocultar = visibleForzado !== undefined ? !visibleForzado : estaOculto;

            if (panelInfo) panelInfo.classList.toggle('ar-ui-oculta', ocultar);

            // Oculta/muestra también el panel flotante de pasos/tamaño (marcadores-estables.js)
            // y el botón/panel de Sonido (sonidos.js)
            const excluidos = new Set(['panel-info', 'panel-historia', 'js-error', 'camera-error']);
            document.querySelectorAll('body > div, body > section, body > aside, body > fieldset, body > form, body > button').forEach(function (el) {
                if (excluidos.has(el.id)) return;
                if (el.tagName === 'BUTTON' || el.classList.contains('panel-ar-control') || el.querySelector('input, button, select')) {
                    el.classList.toggle('ar-ui-oculta', ocultar);
                }
            });
        }

        // ==================================================
        // LISTENER DE COMANDOS DEL DM (padre)
        // ==================================================
        window.addEventListener('message', function (e) {
            if (!e.data || e.data.target !== 'ar-frame') return;
            const cmd = e.data;
            console.log('[AR] Comando recibido del DM:', cmd);

            if (cmd.action === 'toggle-panel') {
                togglePanelesAR(cmd.visible);
                return;
            }

            if (typeof Utilidades === 'undefined') {
                console.warn('[AR] Utilidades no disponible, ignorando:', cmd.action);
                return;
            }

            try {
                switch (cmd.action) {
                    case 'assign-model':
                        limpiarHijosSueltos(cmd.slot);
                        Utilidades.asignarModelo(cmd.slot, {
                            type: cmd.modelType || 'gltf',
                            url: cmd.modelUrl,
                            name: cmd.modelName || 'Modelo',
                            scale: cmd.scale,
                            rotation: cmd.rotation,
                            position: cmd.position,
                            animated: cmd.animated !== false
                        });
                        break;
                    case 'show-model': Utilidades.mostrarModelo(cmd.slot, true); break;
                    case 'hide-model': Utilidades.mostrarModelo(cmd.slot, false); break;
                    case 'assign-stats': Utilidades.asignarStats(cmd.slot, cmd.stats); break;
                    case 'clear-stats': Utilidades.limpiarStats(cmd.slot); break;
                    case 'clear-model':
                        limpiarHijosSueltos(cmd.slot);
                        Utilidades.limpiarModelo(cmd.slot);
                        break;
                    case 'stop-camera':
                        try {
                            const video = document.getElementById('arjs-video') || document.querySelector('video');
                            if (video && video.srcObject) {
                                video.srcObject.getTracks().forEach(function (t) { try { t.stop(); } catch (_) {} });
                                video.srcObject = null;
                            }
                            const sceneEl = document.querySelector('a-scene');
                            if (sceneEl) sceneEl.style.display = 'none';
                            console.log('[AR] Cámara detenida por logout');
                        } catch (err) {
                            console.warn('[AR] stop-camera error:', err);
                        }
                        break;
                    default:
                        console.warn('[AR] Comando desconocido:', cmd.action);
                }
            } catch (err) {
                console.warn('[AR] Error ejecutando comando:', err);
            }
        });

        // ==================================================
        // ARRANQUE: avisar al padre cuando la escena cargue
        // ==================================================
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof Utilidades !== 'undefined' && Utilidades.iniciarFPS) {
                Utilidades.iniciarFPS();
            }
        });

        const scene = document.querySelector('a-scene');
        if (scene) {
            const avisar = function () {
                if (typeof Comunicacion !== 'undefined') {
                    console.log('[AR] Enviando ar-frame-ready al padre');
                    Comunicacion.enviarAlPadre({ action: 'ar-frame-ready' });
                } else {
                    console.warn('[AR] No puedo enviar ar-frame-ready: Comunicacion no existe');
                }
            };
            if (scene.hasLoaded) setTimeout(avisar, 300);
            else scene.addEventListener('loaded', function () { setTimeout(avisar, 300); });

            scene.addEventListener('camera-error', function () {
                const el = document.getElementById('camera-error');
                if (el) el.classList.add('visible');
            });
            scene.addEventListener('arjs-video-loaded', function () {
                const el = document.getElementById('camera-error');
                if (el) el.classList.remove('visible');
                console.log('[AR] Cámara cargada OK');
            });
        }
    </script>
</body>
</html>
